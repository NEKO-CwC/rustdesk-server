name: Build Patched Server S6

on:
  workflow_dispatch:
    inputs:
      IMAGE_TAG:
        description: "Tag for ghcr.io/neko-cwc/rustdesk-server-s6"
        required: true
        default: "ipv6-candidate-forwarding"

permissions:
  contents: read
  packages: write

env:
  CARGO_TERM_COLOR: always
  GHCR_IMAGE: ghcr.io/neko-cwc/rustdesk-server-s6
  IMAGE_TAG: ${{ github.event.inputs.IMAGE_TAG || 'ipv6-candidate-forwarding' }}
  RUST_TARGET: x86_64-unknown-linux-musl
  S6_ARCH: x86_64

jobs:
  build-and-push:
    name: Build and push linux/amd64
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust toolchain
        uses: actions-rs/toolchain@v1
        with:
          toolchain: "1.90"
          override: true
          default: true
          profile: minimal
          target: ${{ env.RUST_TARGET }}

      - name: Build patched binaries
        uses: actions-rs/cargo@v1
        with:
          command: build
          args: --release --all-features --target=${{ env.RUST_TARGET }}
          use-cross: true

      - name: Stage binaries for s6 image
        run: |
          cp target/${RUST_TARGET}/release/hbbs docker/rootfs/usr/bin/hbbs
          cp target/${RUST_TARGET}/release/hbbr docker/rootfs/usr/bin/hbbr
          cp target/${RUST_TARGET}/release/rustdesk-utils docker/rootfs/usr/bin/rustdesk-utils
          chmod -v a+x docker/rootfs/usr/bin/hbbs docker/rootfs/usr/bin/hbbr docker/rootfs/usr/bin/rustdesk-utils

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push s6 image
        uses: docker/build-push-action@v5
        with:
          context: "./docker"
          platforms: linux/amd64
          push: true
          provenance: false
          build-args: |
            S6_ARCH=${{ env.S6_ARCH }}
          tags: |
            ${{ env.GHCR_IMAGE }}:${{ env.IMAGE_TAG }}
            ${{ env.GHCR_IMAGE }}:latest
