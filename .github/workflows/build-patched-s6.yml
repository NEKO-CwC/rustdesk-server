name: Build Patched Server S6

on:
  workflow_dispatch:
    inputs:
      IMAGE_TAG:
        description: "Tag for ghcr.io/neko-cwc/rustdesk-server-s6"
        required: true
        default: "ipv6-candidate-forwarding"

permissions:
  contents: read
  packages: write

env:
  CARGO_TERM_COLOR: always
  GHCR_IMAGE: ghcr.io/neko-cwc/rustdesk-server-s6
  IMAGE_TAG: ${{ github.event.inputs.IMAGE_TAG || 'ipv6-candidate-forwarding' }}

jobs:
  build-and-push:
    name: Build and push - ${{ matrix.job.name }}
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        job:
          - { name: "amd64", target: "x86_64-unknown-linux-musl", docker_platform: "linux/amd64", s6_platform: "x86_64" }
          - { name: "arm64v8", target: "aarch64-unknown-linux-musl", docker_platform: "linux/arm64", s6_platform: "aarch64" }
          - { name: "armv7", target: "armv7-unknown-linux-musleabihf", docker_platform: "linux/arm/v7", s6_platform: "armhf" }

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust toolchain
        uses: actions-rs/toolchain@v1
        with:
          toolchain: "1.90"
          override: true
          default: true
          profile: minimal
          target: ${{ matrix.job.target }}

      - name: Build patched binaries
        uses: actions-rs/cargo@v1
        with:
          command: build
          args: --release --all-features --target=${{ matrix.job.target }}
          use-cross: true

      - name: Stage binaries for s6 image
        run: |
          cp target/${{ matrix.job.target }}/release/hbbs docker/rootfs/usr/bin/hbbs
          cp target/${{ matrix.job.target }}/release/hbbr docker/rootfs/usr/bin/hbbr
          cp target/${{ matrix.job.target }}/release/rustdesk-utils docker/rootfs/usr/bin/rustdesk-utils
          chmod -v a+x docker/rootfs/usr/bin/hbbs docker/rootfs/usr/bin/hbbr docker/rootfs/usr/bin/rustdesk-utils

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push s6 image
        uses: docker/build-push-action@v5
        with:
          context: "./docker"
          platforms: ${{ matrix.job.docker_platform }}
          push: true
          provenance: false
          build-args: |
            S6_ARCH=${{ matrix.job.s6_platform }}
          tags: |
            ${{ env.GHCR_IMAGE }}:${{ env.IMAGE_TAG }}-${{ matrix.job.name }}
            ${{ env.GHCR_IMAGE }}:latest-${{ matrix.job.name }}

  manifest:
    name: Publish multi-arch manifests
    needs: build-and-push
    runs-on: ubuntu-22.04

    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish tagged manifest
        run: |
          docker buildx imagetools create \
            -t "${GHCR_IMAGE}:${IMAGE_TAG}" \
            "${GHCR_IMAGE}:${IMAGE_TAG}-amd64" \
            "${GHCR_IMAGE}:${IMAGE_TAG}-arm64v8" \
            "${GHCR_IMAGE}:${IMAGE_TAG}-armv7"

      - name: Publish latest manifest
        run: |
          docker buildx imagetools create \
            -t "${GHCR_IMAGE}:latest" \
            "${GHCR_IMAGE}:latest-amd64" \
            "${GHCR_IMAGE}:latest-arm64v8" \
            "${GHCR_IMAGE}:latest-armv7"
